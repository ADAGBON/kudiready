# Render Blueprint — infrastructure as code for the API and its database.
# Render → New → Blueprint → pick this repo. It provisions both resources,
# wires DATABASE_URL, and generates JWT_SECRET. Auto-deploys on push to main
# (after CI passes, if "Auto-Deploy: After CI checks pass" is selected).
databases:
  - name: kudiready-db
    plan: free
    region: frankfurt # closest Render region to Lagos
    databaseName: kudiready
    user: kudi
    postgresMajorVersion: "16"

services:
  - type: web
    name: kudiready-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kudiready-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL after the frontend deploys
