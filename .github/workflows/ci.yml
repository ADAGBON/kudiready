name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — lint, migrate, test (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kudi
          POSTGRES_PASSWORD: kudi
          POSTGRES_DB: kudiready
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kudi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://kudi:kudi@localhost:5432/kudiready
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint & format check
        run: ruff check . && ruff format --check .
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
      - name: Tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid

  docker:
    name: API — production image builds and boots
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kudi
          POSTGRES_PASSWORD: kudi
          POSTGRES_DB: kudiready
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kudi" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kudiready-api backend
      - name: Smoke test /healthz
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+psycopg://kudi:kudi@localhost:5432/kudiready \
            -e JWT_SECRET=ci-only-secret-ci-only-secret-ci-only-secret \
            -e ENVIRONMENT=production -e PORT=8000 kudiready-api
          for i in $(seq 1 30); do
            if curl -fsS localhost:8000/healthz | grep -q '"database":true'; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs api; exit 1
